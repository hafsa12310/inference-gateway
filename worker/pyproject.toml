[project]
name = "worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Syeda Hafsa Anis", email = "hafsa.anis@unikrew.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
worker = "worker:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
