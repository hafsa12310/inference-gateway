[project]
name = "worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Syeda Hafsa Anis", email = "hafsa.anis@unikrew.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
worker = "worker:main"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

   [tool.ruff]
   line-length = 100
   [tool.ruff.lint]
   select = ["E", "F", "I", "B", "UP"]
